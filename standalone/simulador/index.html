<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Simulador de benefício — versão standalone (arquivo único, sem Next e sem nada do painel).
     Protótipo 100% no navegador; plataforma independente. Configuração no bloco CONFIGURAÇÃO do <script>. -->
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Simulador Revisa</title>
<meta name="description" content="Simulação ilustrativa de aumento de benefício, 100% no navegador. Plataforma independente com identidade própria; nada é consultado ou armazenado.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Simulador de benefício — versão standalone (arquivo único).
   Espelha app/simulador/simulador.css do painel; se mudar lá, mude aqui.
   Protótipo 100% no navegador: sem backend, API, banco ou consulta a
   sistema. Plataforma independente, sem identidade de órgão público. */

/* base: a página não tem Tailwind/preflight */
html,
body {
  background: #ffffff;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
}

.sim-scope,
.sim-scope *,
.sim-scope *::before,
.sim-scope *::after {
  box-sizing: border-box;
}

.sim-scope :where(h1, h2, h3, p, ul, ol, hr) {
  margin: 0;
  padding: 0;
}

.sim-scope :where(button, input) {
  font: inherit;
  color: inherit;
  margin: 0;
}

.sim-scope :where(button) {
  border: 0;
  background: none;
  padding: 0;
}

.sim-scope :where(a) {
  color: inherit;
}

.sim-scope svg {
  display: block;
}

[hidden] {
  display: none !important;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
}

.sim-scope {
  --sim-white: #ffffff;
  --sim-soft: #f3f5f7;
  --sim-soft-2: #e7ebef;
  --sim-ink: #1f2933; /* 14:1 sobre branco */
  --sim-ink-2: #3e4c59;
  --sim-muted: #5f6b76; /* 5,5:1 sobre branco */
  --sim-line: #d9dee3;
  --sim-line-strong: #7f8b96; /* borda de campo: 3,2:1 (não-texto) */
  --sim-green: #1b7a3f; /* 5,3:1 sobre branco */
  --sim-green-dark: #155f31;
  --sim-green-soft: #e6f3ea;
  --sim-blue: #0f4c8f; /* 8,6:1 sobre branco */
  --sim-blue-dark: #0b3a6e;
  --sim-blue-soft: #e8f0fa;
  --sim-blue-line: #bcd0ea;
  --sim-yellow: #f2c400;
  --sim-yellow-soft: #fff6d5;
  --sim-yellow-line: #ecd47a;
  --sim-yellow-ink: #5b4600;
  --sim-error: #b3261e; /* 6,1:1 sobre branco */
  --sim-radius: 6px;
  --sim-gutter: clamp(16px, 4vw, 24px);
  --sim-font: "Public Sans Variable", "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

  font-family: var(--sim-font);
  font-size: 16px;
  line-height: 1.5;
  color: var(--sim-ink);
  background: var(--sim-white);
  min-height: 100vh;
  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
  color-scheme: light;
  -webkit-tap-highlight-color: transparent;
}

.sim-scope ::selection {
  background: var(--sim-blue);
  color: #fff;
}

.sim-scope :focus-visible {
  outline: 3px solid var(--sim-blue);
  outline-offset: 2px;
}

.sim-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* link de pulo pro conteúdo (aparece só ao receber foco pelo teclado) */
.sim-skip {
  position: absolute;
  top: -100px;
  left: 8px;
  z-index: 50;
  padding: 10px 14px;
  border-radius: var(--sim-radius);
  background: var(--sim-blue);
  color: #fff;
  font-weight: 600;
  text-decoration: none;
}

.sim-skip:focus {
  top: 8px;
}

/* ---------- casca ---------- */

.sim-app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))
  background: var(--sim-white);
}

.sim-main {
  flex: 1;
}

.sim-container {
  width: 100%;
  max-width: 1040px;
  margin-inline: auto;
  padding-inline: var(--sim-gutter);
}

/* área do serviço (etapas + formulário/resultado): coluna de leitura */
.sim-service {
  max-width: 760px;
  padding-bottom: 8px;
  scroll-margin-top: 12px;
}

/* ---------- cabeçalho ---------- */

.sim-header {
  background: var(--sim-white);
  border-bottom: 1px solid var(--sim-line);
}

.sim-header__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  min-height: 64px;
  padding-block: 10px;
}

.sim-brand {
  flex: 1 1 0;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  color: inherit;
  text-decoration: none;
}

.sim-brand svg {
  flex: none;
}

.sim-brand__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.sim-brand__name {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--sim-green-dark);
}

.sim-brand__desc {
  font-size: 12px;
  line-height: 1.3;
  color: var(--sim-muted);
}

.sim-menu-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid var(--sim-line);
  border-radius: var(--sim-radius);
  background: var(--sim-white);
  color: var(--sim-blue);
  font: 600 14px/1 var(--sim-font);
  cursor: pointer;
}

.sim-menu-btn:hover {
  background: var(--sim-blue-soft);
}

.sim-nav {
  display: none;
  flex-basis: 100%;
  border-top: 1px solid var(--sim-line);
}

.sim-nav[data-open] {
  display: block;
}

.sim-nav ul {
  display: flex;
  flex-direction: column;
  margin: 0;
  padding: 6px 0;
  list-style: none;
}

.sim-nav a {
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: 8px 4px;
  color: var(--sim-blue);
  font-weight: 600;
  text-decoration: none;
  border-radius: var(--sim-radius);
}

.sim-nav a:hover {
  background: var(--sim-blue-soft);
}

@media (min-width: 768px) {
  .sim-header__row {
    flex-wrap: nowrap;
  }

  .sim-menu-btn {
    display: none;
  }

  .sim-nav {
    display: block;
    flex-basis: auto;
    border-top: 0;
  }

  .sim-nav ul {
    flex-direction: row;
    gap: 4px;
    padding: 0;
  }

  .sim-nav a {
    padding: 8px 14px;
  }
}

/* faixa fina nas cores nacionais: discreta, só um traço */
.sim-stripe {
  display: flex;
  height: 4px;
}

.sim-stripe i {
  flex: 1;
}

.sim-stripe i:nth-child(1) {
  background: var(--sim-green);
}

.sim-stripe i:nth-child(2) {
  background: var(--sim-yellow);
}

.sim-stripe i:nth-child(3) {
  background: var(--sim-blue);
}

/* ---------- indicador de etapas ---------- */

.sim-stepper {
  display: flex;
  margin: 0;
  padding: 14px 0 2px;
  list-style: none;
}

.sim-stepper li {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.2;
  color: var(--sim-muted);
  text-align: center;
}

.sim-stepper li::before {
  content: "";
  position: absolute;
  top: 14px;
  right: 50%;
  width: 100%;
  height: 2px;
  background: var(--sim-line);
}

.sim-stepper li:first-child::before {
  display: none;
}

.sim-stepper__num {
  position: relative;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 2px solid var(--sim-line-strong);
  border-radius: 50%;
  background: var(--sim-white);
  font-size: 13px;
  font-weight: 700;
  color: var(--sim-muted);
}

.sim-stepper li[data-state="current"] {
  color: var(--sim-ink);
}

.sim-stepper li[data-state="current"] .sim-stepper__num {
  border-color: var(--sim-green);
  background: var(--sim-green);
  color: #fff;
}

.sim-stepper li[data-state="done"] .sim-stepper__num {
  border-color: var(--sim-green);
  background: var(--sim-green-soft);
  color: var(--sim-green-dark);
}

.sim-stepper li[data-state="done"]::before,
.sim-stepper li[data-state="current"]::before {
  background: var(--sim-green);
}

/* ---------- abertura de cada etapa ---------- */

.sim-hero {
  padding: 18px 0 14px;
}

.sim-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--sim-blue);
}

.sim-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 10px;
  padding: 6px 12px;
  border-radius: var(--sim-radius);
  background: var(--sim-green-soft);
  color: var(--sim-green-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.sim-h1 {
  margin: 0;
  font-size: clamp(1.6rem, 4.5vw + 0.6rem, 2.25rem);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.sim-h1:focus {
  outline: none;
}

.sim-lead {
  margin: 10px 0 0;
  max-width: 62ch;
  font-size: 16.5px;
  color: var(--sim-ink-2);
}

/* ---------- painel (formulário, processamento, resultado) ---------- */

.sim-panel {
  background: var(--sim-white);
  border: 1px solid var(--sim-line);
  border-radius: var(--sim-radius);
}

.sim-panel__head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--sim-line);
  border-left: 4px solid var(--sim-green);
  border-radius: var(--sim-radius) var(--sim-radius) 0 0;
}

.sim-panel__icon {
  flex: none;
  color: var(--sim-green);
}

.sim-panel__title {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.3;
}

.sim-panel__title:focus {
  outline: none;
}

.sim-panel__body {
  padding: 20px 18px 22px;
}

/* ---------- formulário ---------- */

.sim-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.sim-form__intro {
  margin: 0;
  font-size: 15px;
  color: var(--sim-muted);
}

.sim-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sim-field__label {
  font-size: 15px;
  font-weight: 700;
}

.sim-field__hint {
  margin: 0;
  font-size: 13.5px;
  color: var(--sim-muted);
}

.sim-field__control {
  position: relative;
}

.sim-field__input {
  width: 100%;
  height: 52px;
  padding: 0 44px 0 14px;
  border: 1px solid var(--sim-line-strong);
  border-radius: var(--sim-radius);
  background: var(--sim-white);
  color: var(--sim-ink);
  font: 400 17px/1 var(--sim-font);
  appearance: none;
  -webkit-appearance: none;
  outline: none;
  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}

.sim-field__input::placeholder {
  color: #8a949e;
  opacity: 1;
}

.sim-field__input:focus {
  border-color: var(--sim-blue);
  box-shadow: 0 0 0 2px var(--sim-blue);
}

/* no input, a borda + o anel de 2px já são o indicador de foco */
.sim-field__input:focus-visible {
  outline: none;
}

.sim-field__input:-webkit-autofill {
  -webkit-box-shadow: 0 0 0 1000px #fff inset;
  -webkit-text-fill-color: var(--sim-ink);
}

.sim-field[data-valid] .sim-field__input {
  border-color: var(--sim-green);
}

.sim-field[data-invalid] .sim-field__input {
  border-color: var(--sim-error);
  box-shadow: 0 0 0 1px var(--sim-error);
}

.sim-field[data-invalid] .sim-field__input:focus {
  box-shadow: 0 0 0 2px var(--sim-error);
}

.sim-field__ok {
  position: absolute;
  top: 50%;
  right: 12px;
  translate: 0 -50%;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--sim-green-soft);
  color: var(--sim-green-dark);
}

.sim-field__error {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--sim-error);
}

.sim-field__error svg {
  flex: none;
  margin-top: 2px;
}

/* ---------- botões ---------- */

.sim-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  padding: 0 20px;
  border: 2px solid transparent;
  border-radius: var(--sim-radius);
  font: 700 16px/1.15 var(--sim-font);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition:
    background-color 0.15s,
    border-color 0.15s,
    color 0.15s;
}

.sim-btn:active {
  transform: translateY(1px);
}

.sim-btn--primary {
  background: var(--sim-green);
  border-color: var(--sim-green);
  color: #fff;
}

.sim-btn--primary:hover {
  background: var(--sim-green-dark);
  border-color: var(--sim-green-dark);
}

.sim-btn--xl {
  min-height: 56px;
  font-size: 17px;
}

.sim-btn--whatsapp {
  min-height: 60px;
  gap: 14px;
}

.sim-btn__stack {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  text-align: left;
}

.sim-btn__stack small {
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  opacity: 0.92;
}

.sim-btn--secondary {
  background: var(--sim-white);
  border-color: var(--sim-blue);
  color: var(--sim-blue);
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
}

.sim-btn--secondary:hover {
  background: var(--sim-blue-soft);
}

.sim-btn--auto {
  width: auto;
  min-height: 48px;
}

.sim-btn__chev {
  transition: transform 0.15s;
}

.sim-btn[aria-expanded="true"] .sim-btn__chev {
  transform: rotate(180deg);
}

.sim-btn--link {
  width: auto;
  min-height: 44px;
  padding: 0 8px;
  background: transparent;
  color: var(--sim-blue);
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.sim-btn--link:hover {
  color: var(--sim-blue-dark);
}

.sim-btn[aria-disabled="true"] {
  pointer-events: none;
  opacity: 0.75;
}

.sim-spin {
  animation: sim-spin 0.9s linear infinite;
}

/* ---------- avisos (informação em azul, atenção em amarelo) ---------- */

.sim-notice {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 12px;
  align-items: start;
  padding: 14px 16px;
  border: 1px solid var(--sim-line);
  border-radius: var(--sim-radius);
}

.sim-notice svg {
  grid-row: 1 / span 2;
  margin-top: 1px;
}

.sim-notice__title {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
}

.sim-notice__body {
  grid-column: 2;
  margin: 0;
  font-size: 14.5px;
  color: var(--sim-ink-2);
}

ul.sim-notice__body {
  padding-left: 18px;
  list-style: disc; /* o preflight do painel zera list-style */
}

ul.sim-notice__body li + li {
  margin-top: 4px;
}

.sim-notice--info {
  background: var(--sim-blue-soft);
  border-color: var(--sim-blue-line);
}

.sim-notice--info svg {
  color: var(--sim-blue);
}

.sim-notice--warn {
  background: var(--sim-yellow-soft);
  border-color: var(--sim-yellow-line);
  border-left: 4px solid var(--sim-yellow);
}

.sim-notice--warn svg {
  color: var(--sim-yellow-ink);
}

.sim-notice--warn .sim-notice__title {
  color: var(--sim-yellow-ink);
}

/* ---------- processamento ---------- */

.sim-processing__hint {
  margin: 0 0 18px;
  font-size: 15px;
  color: var(--sim-muted);
}

.sim-progress {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sim-progress__track {
  height: 14px;
  overflow: hidden;
  border: 1px solid var(--sim-line);
  border-radius: 7px;
  background: var(--sim-soft-2);
}

.sim-progress__fill {
  height: 100%;
  border-radius: 7px;
  background: var(--sim-green);
  transition: width 0.1s linear;
}

.sim-progress__meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
  color: var(--sim-ink-2);
}

.sim-progress__meta strong {
  font-variant-numeric: tabular-nums;
  color: var(--sim-ink);
}

.sim-steps {
  margin: 18px 0 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--sim-line);
}

.sim-step {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 50px;
  padding: 8px 0;
  border-bottom: 1px solid var(--sim-line);
  font-size: 15.5px;
  color: var(--sim-muted);
  transition:
    color 0.2s,
    opacity 0.2s;
}

.sim-step__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: 2px solid var(--sim-line-strong);
  border-radius: 50%;
  color: #fff;
  transition:
    background-color 0.2s,
    border-color 0.2s;
}

.sim-step[data-state="pending"] {
  opacity: 0.6;
}

.sim-step[data-state="active"] {
  color: var(--sim-ink);
  font-weight: 600;
}

.sim-step[data-state="active"] .sim-step__icon {
  border-color: var(--sim-blue);
}

.sim-step[data-state="active"] .sim-step__icon::after {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--sim-blue);
}

.sim-step[data-state="done"] {
  color: var(--sim-ink-2);
}

.sim-step[data-state="done"] .sim-step__icon {
  border-color: var(--sim-green);
  background: var(--sim-green);
}

/* ---------- resultado ---------- */

.sim-value__label {
  margin: 0 0 6px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--sim-green-dark);
}

.sim-value {
  margin: 0 0 18px;
  font-size: clamp(2.2rem, 9vw, 3rem);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.sim-range__title {
  margin: 0 0 8px;
  font-size: 13px;
  color: var(--sim-muted);
}

.sim-range__bar {
  position: relative;
  height: 10px;
  border: 1px solid var(--sim-line);
  border-radius: 5px;
  background: var(--sim-soft-2);
}

.sim-range__fill {
  height: 100%;
  border-radius: 5px;
  background: var(--sim-green);
}

.sim-range__dot {
  position: absolute;
  top: 50%;
  width: 16px;
  height: 16px;
  translate: -50% -50%;
  border: 3px solid var(--sim-green);
  border-radius: 50%;
  background: #fff;
}

.sim-range__labels {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--sim-muted);
}

.sim-disclaimer {
  margin-top: 20px;
}

.sim-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 20px;
}

.sim-explainer {
  padding: 16px 16px 8px;
  border: 1px solid var(--sim-line);
  border-left: 4px solid var(--sim-blue);
  border-radius: var(--sim-radius);
  background: var(--sim-soft);
  outline: none;
}

.sim-explainer__title {

  font-size: 15.5px;
  font-weight: 700;
}

.sim-explainer ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.sim-explainer li {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 14.5px;
  color: var(--sim-ink-2);
}

.sim-explainer li svg {
  flex: none;
  margin-top: 3px;
  color: var(--sim-green);
}

.sim-restart {
  padding-top: 4px;
  text-align: center;
}

/* ---------- seções informativas ---------- */

.sim-section {
  padding: 32px 0;
}

.sim-section--soft {
  margin-top: 28px;
  background: var(--sim-soft);
  border-top: 1px solid var(--sim-line);
  border-bottom: 1px solid var(--sim-line);
}

.sim-section__title {
  margin: 0 0 6px;
  padding-left: 14px;
  border-left: 4px solid var(--sim-green);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
}

.sim-section__intro {
  margin: 0 0 18px;
  color: var(--sim-muted);
}

.sim-cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin: 0;
  padding: 0;
  list-style: none;
}

@media (min-width: 768px) {
  .sim-cards {
    grid-template-columns: repeat(3, 1fr);
  }
}

.sim-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 18px 16px;
  border: 1px solid var(--sim-line);
  border-radius: var(--sim-radius);
  background: var(--sim-white);
}

.sim-card__icon {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: var(--sim-radius);
  background: var(--sim-blue-soft);
  color: var(--sim-blue);
}

.sim-card__step {
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--sim-blue);
}

.sim-card__title {
  margin: 0;
  font-size: 16.5px;
  font-weight: 700;
}

.sim-card__text {
  margin: 0;
  font-size: 15px;
  color: var(--sim-ink-2);
}

.sim-help__text {
  margin: 0;
  max-width: 62ch;
  color: var(--sim-ink-2);
}

.sim-help__contact {
  margin: 18px 0 0;
}

/* ---------- rodapé ---------- */

.sim-footer {
  padding: 26px 0 30px;
  border-top: 4px solid var(--sim-green);
  background: var(--sim-soft);
  font-size: 14px;
  color: var(--sim-ink-2);
}

.sim-footer__grid {
  display: grid;
  gap: 18px;
}

@media (min-width: 768px) {
  .sim-footer__grid {
    grid-template-columns: 1fr auto;
    gap: 32px;
  }
}

.sim-footer__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 16px;
  font-weight: 700;
  color: var(--sim-ink);
}

.sim-footer p {
  margin: 0 0 6px;
  max-width: 70ch;
}

.sim-footer nav ul {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 18px;
  margin: 0;
  padding: 0;
  list-style: none;
}

@media (min-width: 768px) {
  .sim-footer nav ul {
    flex-direction: column;
    gap: 0;
  }
}

.sim-footer nav a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  color: var(--sim-blue);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.sim-footer__bar {
  margin: 18px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--sim-line);
  font-size: 13px;
  color: var(--sim-muted);
}

/* ---------- telas baixas (ex.: 320×568): menos respiro no topo ---------- */

@media (max-height: 600px) {
  .sim-stepper {
    padding-top: 8px;
  }

  .sim-hero {
    padding: 8px 0;
  }

  .sim-lead {
    font-size: 15px;
  }

  .sim-panel__head {
    padding: 10px 14px;
  }

  .sim-panel__body {
    padding: 16px 14px 18px;
  }

  .sim-form {
    gap: 16px;
  }
}

/* ---------- transições entre etapas (curtas, sem exagero) ---------- */

.sim-anim {
  animation: sim-fade 0.22s ease-out both;
}

.sim-screen[data-leaving] .sim-anim {
  animation: sim-fade-out 0.12s ease-in both;
}

@keyframes sim-fade {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes sim-fade-out {
  to {
    opacity: 0;
  }
}

@keyframes sim-spin {
  to {
    transform: rotate(360deg);
  }
}

/* ---------- movimento reduzido ---------- */

@media (prefers-reduced-motion: reduce) {
  .sim-scope *,
  .sim-scope *::before,
  .sim-scope *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

  /** Tempos das transições (ms). */
  const TIMING = { exitMs: 120, redirectMs: 1600 };

  /* =====================================================================
     LÓGICA PURA (espelho de lib/simulador/*.ts)
     ===================================================================== */

  const onlyDigits = (value) => value.replace(/\D/g, "");

  function maskCpf(value) {
    const d = onlyDigits(value).slice(0, 11);
    let out = d.slice(0, 3);
    if (d.length > 3) out += "." + d.slice(3, 6);
    if (d.length > 6) out += "." + d.slice(6, 9);
    if (d.length > 9) out += "-" + d.slice(9, 11);
    return out;
  }

  /** Backspace em cima do "." ou do "-" também apaga o dígito anterior. */
  function nextCpfValue(previousMasked, rawInput, inputType) {
    let digits = onlyDigits(rawInput);
    if (inputType === "deleteContentBackward" && digits === onlyDigits(previousMasked) && digits.length > 0) {
      digits = digits.slice(0, -1);
    }
    return maskCpf(digits);
  }

  function checkDigit(digits, length) {
    let sum = 0;
    for (let i = 0; i < length; i++) sum += Number(digits[i]) * (length + 1 - i);
    const rest = (sum * 10) % 11;
    return rest === 10 ? 0 : rest;
  }

  function isValidCpf(value) {
    const d = onlyDigits(value);
    if (d.length !== 11) return false;
    if (/^(\d)\1{10}$/.test(d)) return false;
    return checkDigit(d, 9) === Number(d[9]) && checkDigit(d, 10) === Number(d[10]);
  }

  const normalizeName = (value) => value.replace(/\s+/g, " ").trim();
  const WORD = "[\\p{L}][\\p{L}'’.\\-]*";
  const FULL_NAME = new RegExp("^" + WORD + "(?: " + WORD + ")+$", "u");

  function isValidFullName(value) {
    const n = normalizeName(value);
    if (n.length < 5 || n.length > 80) return false;
    return FULL_NAME.test(n);
  }

  const PARTICLES = new Set(["da", "das", "de", "do", "dos", "e", "di", "du", "del", "van", "von"]);

  function titleCaseName(value) {
    return normalizeName(value)
      .split(" ")
      .map((word, i) => {
        const lower = word.toLocaleLowerCase("pt-BR");
        if (i > 0 && PARTICLES.has(lower)) return lower;
        return lower
          .split("-")
          .map((part) => part.charAt(0).toLocaleUpperCase("pt-BR") + part.slice(1))
          .join("-");
      })
      .join(" ");
  }

  const firstName = (value) => titleCaseName(value).split(" ")[0] || "";

  function randomIntInclusive(min, max) {
    const lo = Math.ceil(Math.min(min, max));
    const hi = Math.floor(Math.max(min, max));
    return lo + Math.floor(Math.random() * (hi - lo + 1));
  }

  const generateEstimateCents = () => randomIntInclusive(ESTIMATE.minBRL, ESTIMATE.maxBRL) * 100;

  const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const brlWhole = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 0, maximumFractionDigits: 0 });
  const formatBRL = (cents) => brl.format(Math.round(cents) / 100);
  const formatBRLWhole = (reais) => brlWhole.format(reais);

  function positionInRange(cents) {
    const min = ESTIMATE.minBRL * 100;
    const max = ESTIMATE.maxBRL * 100;
    if (max <= min) return 1;
    return Math.min(1, Math.max(0, (cents - min) / (max - min)));
  }

  function buildWhatsappUrl(number, template, vars) {
    const text = template.replace(/\{(nome|valor)\}/g, (_, key) => vars[key]);
    return "https://wa.me/" + onlyDigits(number) + "?text=" + encodeURIComponent(text);
  }

  /* =====================================================================
     UTILITÁRIOS DE DOM E ÍCONES

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const $ = (sel, root = document) => root.querySelector(sel);
  const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  const reduced = () => motionQuery.matches;

  const stroke = (paths, size = 20, cls = "", width = 2) =>

  const icons = {
    check: (size, cls, width) => stroke('<path d="M5 12.5l4.5 4.5L19 7.5"/>', size, cls, width),

    whatsapp: (size) =>
      '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>',

    brand: (size) =>

  /* =====================================================================
     MÁQUINA DE ESTADOS
     Estados em data-state (.sim-app): idle · filled · error · processing ·
     result · redirecting · restart
     ===================================================================== */

  const app = $("#app");
  const host = $("#screen-host");
  const STEP_INDEX = { landing: 0, processing: 1, result: 2 };
  let view = { name: "landing" };
  let restarting = false;
  let redirecting = false;
  let formStatus = "idle";
  let exitTimer = 0;
  let redirectTimer = 0;
  let settleTimer = 0;
  let rafId = 0;
  let firstRender = true;

  function setState() {
    app.dataset.state = restarting
      ? "restart"
      : view.name === "landing"
        ? formStatus
        : view.name === "processing"
          ? "processing"
          : redirecting
            ? "redirecting"
            : "result";
  }

  function stopLoops() {
    cancelAnimationFrame(rafId);
    rafId = 0;
    clearTimeout(settleTimer);
  }

  function render() {
    stopLoops();
    renderStepper(STEP_INDEX[view.name]);
    host.innerHTML = "";
    const screen = document.createElement("div");
    screen.className = "sim-screen";
    if (view.name === "landing") {
      screen.innerHTML = landingHTML();
      host.appendChild(screen);
      wireLanding(screen);
    } else if (view.name === "processing") {
      screen.innerHTML = processingHTML();
      host.appendChild(screen);
      wireProcessing(screen);
    } else {
      screen.innerHTML = resultHTML(view);
      host.appendChild(screen);
      wireResult(screen, view);
    }
    setState();
    if (firstRender) {
      firstRender = false;
      return;
    }
    // troca de etapa: topo + foco no título (teclado e leitores de tela)
    window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
    const heading = $("[data-heading]", screen);
    if (heading) heading.focus({ preventScroll: true });
  }

  function go(next) {
    clearTimeout(exitTimer);
    const commit = () => {
      view = next;
      restarting = false;
      render();
    };
    if (reduced()) {
      commit();
      return;
    }
    const screen = $(".sim-screen", host);
    if (screen) screen.setAttribute("data-leaving", "");
    exitTimer = setTimeout(commit, TIMING.exitMs);
  }

  /* ---------- casca: cabeçalho, etapas, seções, rodapé ---------- */

  $("#skip").textContent = COPY.skipLink;

  function renderHeader() {
    const header = $("#header");
    header.innerHTML =
      '<div class="sim-container sim-header__row">' +
      '<a class="sim-brand" href="#inicio">' + icons.brand(36) +
      '<span class="sim-brand__text"><span class="sim-brand__name">' + esc(BRAND.name) + '</span><span class="sim-brand__desc">' + esc(BRAND.descriptor) + "</span></span></a>" +
      '<button type="button" class="sim-menu-btn" aria-expanded="false" aria-controls="sim-menu">' + icons.menu(18) + "<span>" + esc(COPY.header.menu) + "</span></button>" +
      '<nav id="sim-menu" class="sim-nav" aria-label="' + esc(COPY.header.navLabel) + '"><ul>' +
      MENU.map((item) => '<li><a href="' + esc(item.href) + '">' + esc(item.label) + "</a></li>").join("") +
      "</ul></nav></div>" +
      '<div class="sim-stripe" aria-hidden="true"><i></i><i></i><i></i></div>';
    const btn = $(".sim-menu-btn", header);
    const nav = $("#sim-menu", header);
    const setOpen = (open) => {
      btn.setAttribute("aria-expanded", String(open));
      btn.innerHTML = (open ? icons.close(18) : icons.menu(18)) + "<span>" + esc(open ? COPY.header.closeMenu : COPY.header.menu) + "</span>";
      nav.toggleAttribute("data-open", open);
    };
    btn.addEventListener("click", () => setOpen(btn.getAttribute("aria-expanded") !== "true"));
    header.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => setOpen(false)));
  }

  function renderStepper(current) {
    $("#stepper-host").innerHTML =
      '<ol class="sim-stepper" aria-label="Etapa ' + (current + 1) + " de " + STEPS.length + '">' +
      STEPS.map((label, i) => {
        const state = i < current ? "done" : i === current ? "current" : "upcoming";
        return '<li data-state="' + state + '"' + (state === "current" ? ' aria-current="step"' : "") + '><span class="sim-stepper__num" aria-hidden="true">' +
          (state === "done" ? icons.check(14, "", 3) : i + 1) + '</span><span class="sim-stepper__label">' + esc(label) + "</span></li>";
      }).join("") +
      "</ol>";
  }

  function renderSections() {
    const cardIcons = [icons.id, icons.calc, icons.chat];
    const contactUrl = buildWhatsappUrl(WHATSAPP_NUMBER, COPY.help.contact.message, { nome: "", valor: "" });
    $("#sections-host").innerHTML =
      '<section id="como-funciona" class="sim-section sim-section--soft" aria-labelledby="sim-how-title"><div class="sim-container">' +
      '<h2 id="sim-how-title" class="sim-section__title">' + esc(COPY.howItWorks.title) + "</h2>" +
      '<p class="sim-section__intro">' + esc(COPY.howItWorks.intro) + "</p>" +
      '<ol class="sim-cards">' +
      COPY.howItWorks.steps.map((s, i) => '<li class="sim-card"><span class="sim-card__icon">' + (cardIcons[i] || icons.id)(22) + '</span><span class="sim-card__step">Passo ' + (i + 1) + '</span><h3 class="sim-card__title">' + esc(s.title) + '</h3><p class="sim-card__text">' + esc(s.text) + "</p></li>").join("") +
      "</ol></div></section>" +
      '<section id="ajuda" class="sim-section sim-help" aria-labelledby="sim-help-title"><div class="sim-container">' +
      '<h2 id="sim-help-title" class="sim-section__title">' + esc(COPY.help.title) + "</h2>" +
      '<p class="sim-help__text">' + esc(COPY.help.text) + "</p>" +
      '<p class="sim-help__contact"><a class="sim-btn sim-btn--secondary sim-btn--auto" href="' + esc(contactUrl) + '" target="_blank" rel="noopener noreferrer">' + icons.whatsapp(20) + "<span>" + esc(COPY.help.contact.label) + "</span></a></p>" +
      "</div></section>";
  }

  function renderFooter() {
    $("#footer").innerHTML =
      '<div class="sim-container"><div class="sim-footer__grid"><div>' +
      '<div class="sim-footer__brand">' + icons.brand(28) + "<span>" + esc(BRAND.name) + "</span></div>" +
      "<p>" + esc(COPY.footer.statement.replace("{marca}", BRAND.name)) + "</p></div>" +
      '<nav aria-label="' + esc(COPY.footer.navLabel) + '"><ul>' + MENU.map((item) => '<li><a href="' + esc(item.href) + '">' + esc(item.label) + "</a></li>").join("") + "</ul></nav></div>" +
      '<p class="sim-footer__bar">' + esc(BRAND.name + " · " + BRAND.descriptor) + "</p></div>";
  }

  /* ---------- etapa 1: identificação ---------- */

  function fieldHTML(key, cfg, attrs) {
    return (
      '<div class="sim-field" data-field="' + key + '">' +
      '<label for="sim-' + key + '" class="sim-field__label">' + esc(cfg.label) + "</label>" +
      '<p id="sim-' + key + '-dica" class="sim-field__hint">' + esc(cfg.hint) + "</p>" +
      '<div class="sim-field__control"><input id="sim-' + key + '" name="' + key + '" class="sim-field__input" type="text" placeholder="' + esc(cfg.placeholder) + '" aria-describedby="sim-' + key + '-dica" ' + attrs + "></div>" +
      "</div>"
    );
  }

  function landingHTML() {
    return (
      '<div class="sim-anim">' +
      '<section class="sim-hero"><p class="sim-eyebrow">' + esc(COPY.hero.eyebrow) + "</p>" +
      '<h1 class="sim-h1" tabindex="-1" data-heading>' + esc(COPY.hero.title) + "</h1>" +
      '<p class="sim-lead">' + esc(COPY.hero.subtitle) + "</p></section>" +
      '<section class="sim-panel" aria-labelledby="sim-form-title">' +
      '<div class="sim-panel__head">' + icons.form(22, "sim-panel__icon") + '<h2 id="sim-form-title" class="sim-panel__title">' + esc(COPY.form.heading) + "</h2></div>" +
      '<div class="sim-panel__body"><form class="sim-form" id="sim-form" novalidate>' +
      '<p class="sim-form__intro">' + esc(COPY.form.intro) + "</p>" +
      fieldHTML("nome", COPY.form.name, 'autocomplete="name" autocapitalize="words" spellcheck="false" maxlength="80" enterkeyhint="next"') +
      fieldHTML("cpf", COPY.form.cpf, 'inputmode="numeric" autocomplete="off" maxlength="14" enterkeyhint="done"') +
      '<p class="sim-sr" aria-live="assertive" id="sim-live"></p>' +
      '<div class="sim-form__submit"><button type="submit" class="sim-btn sim-btn--primary sim-btn--xl"><span>' + esc(COPY.form.submit) + "</span>" + icons.arrow(20) + "</button></div>" +
      "</form></div></section></div>"
    );
  }

  function wireLanding(screen) {
    const form = $("#sim-form", screen);
    const live = $("#sim-live", screen);
    const inputs = { nome: $("#sim-nome", screen), cpf: $("#sim-cpf", screen) };
    const values = { nome: "", cpf: "" };
    const touched = { nome: false, cpf: false };
    let submitted = false;

    const errorsOf = () => ({
      nome: isValidFullName(values.nome) ? "" : COPY.form.name.error,
      cpf: isValidCpf(values.cpf) ? "" : COPY.form.cpf.error,
    });

    function update() {
      const errors = errorsOf();
      let anyError = false;
      for (const key of ["nome", "cpf"]) {
        const field = $('[data-field="' + key + '"]', screen);
        const control = $(".sim-field__control", field);
        const input = inputs[key];
        const show = (touched[key] || submitted) && Boolean(errors[key]);
        const valid = !errors[key] && !show;
        anyError = anyError || show;
        field.toggleAttribute("data-invalid", show);
        field.toggleAttribute("data-valid", valid);
        if (show) {
          input.setAttribute("aria-invalid", "true");
          input.setAttribute("aria-describedby", "sim-" + key + "-dica sim-" + key + "-erro");
        } else {
          input.removeAttribute("aria-invalid");
          input.setAttribute("aria-describedby", "sim-" + key + "-dica");
        }
        const ok = $(".sim-field__ok", control);
        if (valid && !ok) control.insertAdjacentHTML("beforeend", '<span class="sim-field__ok">' + icons.check(15, "", 2.5) + "</span>");
        else if (!valid && ok) ok.remove();
        const err = $(".sim-field__error", field);
        if (show && !err) field.insertAdjacentHTML("beforeend", '<p id="sim-' + key + '-erro" class="sim-field__error">' + icons.alert(16) + "<span>" + esc(errors[key]) + "</span></p>");
        else if (!show && err) err.remove();
      }
      formStatus = anyError ? "error" : !errors.nome && !errors.cpf ? "filled" : "idle";
      setState();
    }

    inputs.nome.addEventListener("input", () => {
      values.nome = inputs.nome.value;
      update();
    });
    inputs.cpf.addEventListener("input", (e) => {
      const next = nextCpfValue(values.cpf, inputs.cpf.value, e.inputType);
      values.cpf = next;
      if (inputs.cpf.value !== next) inputs.cpf.value = next;
      update();
    });
    for (const key of ["nome", "cpf"]) {
      inputs[key].addEventListener("blur", () => {
        if (touched[key]) return;
        touched[key] = true;
        update();
      });
    }
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      submitted = true;
      const errors = errorsOf();
      if (errors.nome || errors.cpf) {
        touched.nome = touched.cpf = true;
        update();
        // limpa e reanuncia, mesmo que a mensagem seja igual à anterior
        live.textContent = "";
        requestAnimationFrame(() => {
          live.textContent = COPY.form.invalidSummary;
        });
        (errors.nome ? inputs.nome : inputs.cpf).focus();
        return;
      }
      go({ name: "processing", lead: { nome: normalizeName(values.nome), cpf: values.cpf } });
    });
    update();
  }

  /* ---------- etapa 2: análise ---------- */

  function processingHTML() {
    return (
      '<div class="sim-anim"><section class="sim-panel" aria-labelledby="sim-processing-title">' +
      '<div class="sim-panel__head"><h1 id="sim-processing-title" class="sim-panel__title" tabindex="-1" data-heading>' + esc(PROCESSING.title) + "</h1></div>" +
      '<div class="sim-panel__body"><p class="sim-processing__hint">' + esc(PROCESSING.hint) + "</p>" +
      '<div class="sim-progress" role="progressbar" aria-label="' + esc(PROCESSING.title) + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">' +
      '<div class="sim-progress__track"><div class="sim-progress__fill" style="width:0%"></div></div>' +
      '<div class="sim-progress__meta" aria-hidden="true"><strong data-pct>0%</strong><span data-status></span></div></div>' +
      '<ol class="sim-steps" aria-label="Etapas do processamento">' +
      PROCESSING.steps.map((s) => '<li class="sim-step" data-state="pending"><span class="sim-step__icon" aria-hidden="true"></span><span>' + esc(s.label) + "</span></li>").join("") +
      "</ol>" +
      '<p class="sim-sr" aria-live="polite" data-live></p>' +
      "</div></section></div>"
    );
  }

  /** Começa rápido e desacelera de leve no fim, como um carregamento de verdade. */
  const easeProgress = (t) => 0.5 * t + 0.5 * (1 - (1 - t) * (1 - t));

  function wireProcessing(screen) {
    const bar = $("[role=progressbar]", screen);
    const fill = $(".sim-progress__fill", screen);
    const pct = $("[data-pct]", screen);
    const status = $("[data-status]", screen);
    const live = $("[data-live]", screen);
    const steps = Array.from(screen.querySelectorAll(".sim-step"));
    const start = performance.now();
    let lastCurrent = -1;

    const tick = (now) => {
      const t = Math.min(1, (now - start) / PROCESSING.durationMs);
      const p = easeProgress(t);
      const percent = Math.round(p * 100);
      fill.style.width = percent + "%";
      pct.textContent = percent + "%";
      bar.setAttribute("aria-valuenow", String(percent));
      let active = -1;
      steps.forEach((li, i) => {
        const next = PROCESSING.steps[i + 1] ? PROCESSING.steps[i + 1].at : 1;
        const state = p >= next ? "done" : p >= PROCESSING.steps[i].at ? "active" : "pending";
        if (li.dataset.state !== state) {
          li.dataset.state = state;
          $(".sim-step__icon", li).innerHTML = state === "done" ? icons.check(14, "", 3) : "";
          if (state === "done") li.insertAdjacentHTML("beforeend", '<span class="sim-sr"> (concluído)</span>');
        }
        if (state === "active") active = i;
      });
      const current = active >= 0 ? active : steps.length - 1;
      if (current !== lastCurrent) {
        lastCurrent = current;
        status.textContent = PROCESSING.steps[current].label;
        live.textContent = PROCESSING.steps[current].label;
        bar.setAttribute("aria-valuetext", percent + "% — " + PROCESSING.steps[current].label);
      }
      if (t < 1) {
        rafId = requestAnimationFrame(tick);
      } else {
        settleTimer = setTimeout(() => {
          if (view.name !== "processing") return;
          go({ name: "result", lead: view.lead, estimateCents: generateEstimateCents() });
        }, PROCESSING.settleMs);
      }
    };
    rafId = requestAnimationFrame(tick);
  }

  /* ---------- etapa 3: resultado ---------- */

  function resultHTML(v) {
    const valor = formatBRL(v.estimateCents);
    const pos = positionInRange(v.estimateCents) * 100;
    const url = buildWhatsappUrl(WHATSAPP_NUMBER, WHATSAPP_MESSAGE, { nome: titleCaseName(v.lead.nome), valor });
    const min = formatBRLWhole(ESTIMATE.minBRL);
    const max = formatBRLWhole(ESTIMATE.maxBRL);
    return (
      '<div class="sim-anim">' +
      '<section class="sim-hero"><p class="sim-status">' + icons.check(16, "", 3) + esc(COPY.result.eyebrow) + "</p>" +
      '<h1 class="sim-h1" tabindex="-1" data-heading>' + esc(COPY.result.greeting.replace("{nome}", firstName(v.lead.nome))) + "</h1>" +
      '<p class="sim-lead">' + esc(COPY.result.lead) + "</p></section>" +
      '<section class="sim-panel" aria-labelledby="sim-result-title">' +
      '<div class="sim-panel__head"><h2 id="sim-result-title" class="sim-panel__title">' + esc(COPY.result.panelTitle) + "</h2></div>" +
      '<div class="sim-panel__body">' +
      '<p class="sim-value__label">' + esc(COPY.result.cardLabel) + "</p>" +
      '<p class="sim-value" data-testid="estimate-value">' + esc(valor) + "</p>" +
      '<div class="sim-range" role="img" aria-label="' + esc(COPY.result.rangeLabel + ": de " + min + " a " + max) + '">' +
      '<p class="sim-range__title" aria-hidden="true">' + esc(COPY.result.rangeLabel) + "</p>" +
      '<div class="sim-range__bar"><div class="sim-range__fill" style="width:' + pos + '%"></div><span class="sim-range__dot" style="left:' + pos + '%"></span></div>' +
      '<div class="sim-range__labels" aria-hidden="true"><span>' + esc(min) + "</span><span>" + esc(max) + "</span></div></div>" +
      '<div class="sim-notice sim-notice--warn sim-disclaimer" role="note">' + icons.alert(20) + '<p class="sim-notice__title">' + esc(COPY.result.attention) + '</p><p class="sim-notice__body">' + esc(COPY.result.disclaimer) + "</p></div>" +
      '<div class="sim-actions">' +
      '<a class="sim-btn sim-btn--primary sim-btn--xl sim-btn--whatsapp" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" data-testid="cta-whatsapp" data-cta>' +
      icons.whatsapp(22) +
      '<span class="sim-btn__stack"><span data-cta-label>' + esc(COPY.result.ctaPrimary) + "</span><small>" + esc(COPY.result.ctaPrimaryHint) + "</small></span></a>" +
      '<button type="button" class="sim-btn sim-btn--secondary" aria-expanded="false" aria-controls="sim-explainer" data-testid="cta-explain" data-explain><span>' + esc(COPY.result.ctaSecondary) + "</span>" + icons.chevron(18, "sim-btn__chev") + "</button>" +
      '<div class="sim-restart"><button type="button" class="sim-btn sim-btn--link" data-testid="cta-restart" data-restart>' + icons.refresh(18) + "<span>" + esc(COPY.result.restart) + "</span></button></div>" +
      "</div></div></section></div>"
    );
  }

  function wireResult(screen) {
    // CTA: link normal do WhatsApp + estado "abrindo" por alguns segundos
    const cta = $("[data-cta]", screen);
    cta.addEventListener("click", (e) => {
      if (redirecting) {
        e.preventDefault();
        return;
      }
      redirecting = true;
      setState();
      cta.setAttribute("aria-disabled", "true");
      $("svg", cta).outerHTML = icons.spinner(22);
      $("[data-cta-label]", cta).textContent = COPY.result.ctaRedirecting;
      clearTimeout(redirectTimer);
      redirectTimer = setTimeout(() => {
        redirecting = false;
        setState();
        if (!cta.isConnected) return;
        cta.removeAttribute("aria-disabled");
        $("svg", cta).outerHTML = icons.whatsapp(22);
        $("[data-cta-label]", cta).textContent = COPY.result.ctaPrimary;
      }, TIMING.redirectMs);
    });

    // "Entender como funciona": painel expansível logo abaixo do botão
    const explain = $("[data-explain]", screen);
    explain.addEventListener("click", () => {
      const open = explain.getAttribute("aria-expanded") === "true";
      explain.setAttribute("aria-expanded", String(!open));
      const existing = $("#sim-explainer", screen);
      if (open) {
        if (existing) existing.remove();
        return;
      }
      explain.insertAdjacentHTML(
        "afterend",
        '<section id="sim-explainer" class="sim-explainer" tabindex="-1" aria-labelledby="sim-explainer-title">' +
          '<h3 id="sim-explainer-title" class="sim-explainer__title">' + esc(COPY.result.explainer.title) + "</h3><ul>" +
          COPY.result.explainer.items.map((item) => "<li>" + icons.check(16) + "<span>" + esc(item) + "</span></li>").join("") +
          "</ul></section>"
      );
      const panel = $("#sim-explainer", screen);
      panel.focus({ preventScroll: true });
      panel.scrollIntoView({ block: "nearest", behavior: reduced() ? "auto" : "smooth" });
    });

    // nova simulação
    $("[data-restart]", screen).addEventListener("click", () => {
      restarting = true;
      redirecting = false;
      clearTimeout(redirectTimer);
      setState();
      go({ name: "landing" });
    });
  }

  renderHeader();
  renderSections();
  renderFooter();
  render();
})();
</script>
</body>
</html>
