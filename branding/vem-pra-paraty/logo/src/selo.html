<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts-local.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  #stage{width:1024px;height:1024px}
</style></head>
<body>
<div id="stage">
<svg id="selo" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="innerClip"><circle cx="512" cy="512" r="318"/></clipPath>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB84D"/><stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2D48"/><stop offset="1" stop-color="#0E4A63"/>
    </linearGradient>
    <path id="arcTop" d="M 124 512 A 388 388 0 0 1 900 512" fill="none"/>
    <path id="arcBottom" d="M 140 512 A 372 372 0 0 0 884 512" fill="none"/>
  </defs>

  <!-- fundo do selo -->
  <circle cx="512" cy="512" r="500" fill="#0B2D48"/>
  <circle cx="512" cy="512" r="478" fill="none" stroke="#F6EFE3" stroke-width="6"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="#F6EFE3" stroke-width="5"/>

  <!-- miolo: céu -->
  <g clip-path="url(#innerClip)">
    <circle cx="512" cy="512" r="318" fill="url(#skyGrad)"/>
    <!-- sol -->
    <circle cx="512" cy="448" r="145" fill="url(#sunGrad)"/>
    <!-- serra de Paraty -->
    <path d="M 120 660 Q 300 420 480 665 L 480 700 L 120 700 Z" fill="#11574B"/>
    <path d="M 520 665 Q 705 455 900 668 L 900 700 L 520 700 Z" fill="#0C453C"/>
    <!-- gaivotas -->
    <g stroke="#F6EFE3" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M 348 330 Q 362 314 376 326 Q 390 314 404 330"/>
      <path d="M 622 296 Q 633 284 644 293 Q 655 284 666 296"/>
    </g>

    <!-- lancha -->
    <g id="boat">
      <!-- casco: cunha planando, proa alta à direita -->
      <path d="M 366 566 Q 362 560 372 558 L 738 512 Q 752 510 748 522 L 716 586 Q 712 594 700 595 L 398 602 Q 384 602 380 594 Z" fill="#F6EFE3"/>
      <!-- parabrisa -->
      <path d="M 556 546 L 596 498 Q 600 493 608 492 L 646 488 L 626 537 Z" fill="#0B2D48"/>
      <!-- listra laranja -->
      <path d="M 398 576 L 712 538 L 706 552 L 398 588 Z" fill="#FF7A45"/>
      <!-- spray da proa -->
      <g stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.9">
        <path d="M 730 576 Q 750 586 756 606"/>
        <path d="M 746 556 Q 772 570 780 594"/>
      </g>
      <!-- esteira da popa -->
      <g fill="#FFFFFF" opacity="0.7">
        <circle cx="352" cy="598" r="7"/>
        <circle cx="332" cy="606" r="4"/>
      </g>
    </g>

    <!-- ondas -->
    <g>
      <path d="M 170 608 Q 230 584 290 608 T 410 608 T 530 608 T 650 608 T 770 608 T 890 608 L 890 700 L 170 700 Z" fill="#17C3B2"/>
      <path d="M 155 656 Q 215 632 275 656 T 395 656 T 515 656 T 635 656 T 755 656 T 875 656 L 875 770 L 155 770 Z" fill="#0E9AA7"/>
      <path d="M 145 712 Q 205 688 265 712 T 385 712 T 505 712 T 625 712 T 745 712 T 865 712 L 865 860 L 145 860 Z" fill="#0B6E80"/>
    </g>
  </g>

  <!-- texto arco superior -->
  <text font-family="'Lilita One'" font-size="92" fill="#F6EFE3" letter-spacing="14">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">VEM PRA PARATY</textPath>
  </text>
  <!-- texto arco inferior -->
  <text font-family="Poppins" font-weight="700" font-size="44" fill="#17C3B2" letter-spacing="8">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">PASSEIOS DE LANCHA • PARATY-RJ</textPath>
  </text>

  <!-- diamantes laterais -->
  <g fill="#FF7A45">
    <rect x="96" y="496" width="26" height="26" transform="rotate(45 109 509)"/>
    <rect x="902" y="496" width="26" height="26" transform="rotate(45 915 509)"/>
  </g>
</svg>
</div>
</body></html>
