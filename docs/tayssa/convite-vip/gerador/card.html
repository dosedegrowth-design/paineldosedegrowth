<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --vinho:#4a0d1f; --bordo:#6c1529; --ouro:#a8834a; --ouro-claro:#e6c993; --tinta:#3b1f24; --marfim:#fbf6ee;
    --serif:'Bodoni Moda',Didot,Georgia,serif; --sans:'Inter',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; font-optical-sizing:none !important; font-variation-settings:'opsz' 11 !important; }
  html,body { width:1080px; height:1350px; overflow:hidden; background:var(--marfim); }
  body { font-family:var(--sans); color:var(--tinta); -webkit-font-smoothing:antialiased; }
  .card { position:relative; width:1080px; height:1350px; overflow:hidden; }
  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .fg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding:70px 60px 0 280px; }

  .marca { font:600 22px/1 var(--sans); letter-spacing:.3em; color:#fbf6ee; background:var(--vinho); padding:13px 22px 13px 25px; border-radius:999px; }
  .marca b { font-weight:600; color:#f4a6c0; }
  .eyebrow { margin-top:40px; display:flex; align-items:center; gap:18px; font:600 22px/1 var(--sans); letter-spacing:.42em; color:var(--ouro); }
  .eyebrow::before, .eyebrow::after { content:''; width:70px; height:1.5px; background:linear-gradient(90deg,transparent,var(--ouro)); }
  .eyebrow::after { transform:scaleX(-1); }
  h1 { margin-top:22px; text-align:center; font:italic 600 80px/1.06 var(--serif); color:var(--bordo); }
  h1 span { display:block; }

  .foto { position:relative; margin-top:34px; width:404px; height:505px; background:#fffdf8; padding:16px 16px 16px;
    box-shadow:0 0 0 1.5px rgba(168,131,74,.55), 0 18px 36px rgba(74,13,31,.18); transform:rotate(-2deg); }
  .foto img { display:block; width:100%; height:100%; object-fit:cover; object-position:50% 30%; }
  .fita { position:absolute; top:-22px; left:50%; width:150px; height:42px; margin-left:-75px; transform:rotate(3deg);
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 6px, transparent 6px 14px), rgba(233,216,187,.86); box-shadow:0 2px 6px rgba(74,13,31,.12); }

  .intro { margin-top:38px; text-align:center; font:500 31px/1.35 var(--serif); color:var(--vinho); }
  .intro em { font-style:italic; font-weight:700; color:var(--bordo); }
  .area { margin-top:16px; display:flex; gap:14px; align-items:center; font:600 21px/1 var(--sans); letter-spacing:.06em; color:var(--tinta); }
  .area i { width:6px; height:6px; border-radius:50%; background:var(--ouro); }
  .site { margin-top:30px; display:flex; flex-direction:column; align-items:center; gap:10px; background:var(--vinho); color:#fbf6ee;
    padding:20px 46px 22px; border-radius:22px; box-shadow:inset 0 0 0 1.5px rgba(230,201,147,.55), 0 14px 30px rgba(74,13,31,.22); }
  .site small { font:600 17px/1 var(--sans); letter-spacing:.28em; color:var(--ouro-claro); }
  .site b { font:700 46px/1 var(--serif); letter-spacing:.01em; }
  .nota { margin-top:22px; text-align:center; font:500 22px/1.4 var(--sans); color:var(--tinta); }
  .nota strong { color:var(--bordo); font-weight:700; }
.foto { margin-top:30px; width:380px; height:470px; }
  .bilhete { margin-top:34px; width:680px; display:flex; flex-direction:column; align-items:center; text-align:center;
    background:#fffcf6; padding:30px 36px 28px; border-radius:6px; box-shadow:0 0 0 1.5px rgba(168,131,74,.45), 0 16px 34px rgba(74,13,31,.16); }
  .intro { margin-top:0; font:600 33px/1.3 var(--serif); }
  .area { margin-top:12px; font:500 23px/1.35 var(--sans); letter-spacing:0; display:block; }
  .site { margin-top:22px; }
  .nota { margin-top:16px; font-size:21px; }
  h1 { font-size:78px; }
.foto { width:350px; height:432px; margin-top:26px; }
  .bilhete { margin-top:30px; }
  .intro, .area, .nota, h1 { text-wrap: balance; }
  .site b { font:700 44px/1 var(--sans); letter-spacing:.01em; }
  .bilhete { padding-bottom:26px; }
</style></head>
<body><div class="card">
  <img class="bg" src="canva/lirios.jpg">
  <div class="fg">
    <div class="marca">TAYSSA <b>FARIAS</b></div>
    <div class="eyebrow">CONVITE VIP</div>
    <h1><span>Você faz parte</span><span>do meu grupo VIP</span></h1>
    <figure class="foto"><img src="fotos/tayssa.jpg" alt=""><span class="fita"></span></figure>
    <div class="bilhete">
      <p class="intro">Meu novo site chegou, e quero te apresentar <em>antes de todo mundo.</em></p>
      <p class="area">Na sua Área VIP: benefícios, pontos e agenda com prioridade.</p>
      <div class="site"><small>FAÇA O SEU CADASTRO</small><b>tayssafarias.com.br</b></div>
      <p class="nota">Depois do cadastro, <strong>eu aprovo a sua Área VIP</strong> pelo meu painel.</p>
    </div>
  </div>
</div>
<script>Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]).then(() => document.body.dataset.ready = '1');</script>
</body></html>
